name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: CI=true pnpm install

      - name: Build TypeScript
        run: pnpm --filter generatorlog-backend run build

      - name: Package for deployment
        run: |
          mkdir -p /tmp/backend-staging
          cp backend/package.json /tmp/backend-staging/
          cp -r backend/dist /tmp/backend-staging/
          echo "node-linker=hoisted" > /tmp/backend-staging/.npmrc
          CI=true pnpm install --prod --dir /tmp/backend-staging
          cd /tmp/backend-staging
          zip -r /tmp/backend-deploy.zip dist/ node_modules/ package.json -x "*.map"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group generatorlog-rg \
            --name generatorlog-api \
            --src-path /tmp/backend-deploy.zip \
            --type zip

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: CI=true pnpm install

      - name: Build frontend
        run: pnpm --filter frontend run build
        env:
          VITE_API_URL: https://generatorlog-api.azurewebsites.net

      - name: Package for deployment
        run: |
          mkdir -p /tmp/frontend-staging
          cp -r frontend/dist /tmp/frontend-staging/
          cat > /tmp/frontend-staging/package.json << 'EOF'
          {"name":"generatorlog-frontend","version":"1.0.0","scripts":{"start":"serve -s dist"},"dependencies":{"serve":"^14.2.4"}}
          EOF
          cd /tmp/frontend-staging
          echo "node-linker=hoisted" > .npmrc
          CI=true pnpm install --prod
          zip -r /tmp/frontend-deploy.zip dist/ node_modules/ package.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group generatorlog-rg \
            --name generatorlog \
            --src-path /tmp/frontend-deploy.zip \
            --type zip
